name = "protectedshare-api"
main = "src/index.ts"
compatibility_date = "2025-05-10"

# The hosted site's browsers call the API here directly (NEXT_PUBLIC_API_ORIGIN in the web app), so
# API traffic never passes through the web host. Needs the protectedshare.me zone in this Cloudflare
# account; the first deploy creates the DNS record and certificate. The workers.dev URL keeps
# working (the web app's /api relay and older pages use it). Self-hosting? Change or delete this.
routes = [{ pattern = "api.protectedshare.me", custom_domain = true }]
# Keep protectedshare-api.<account>.workers.dev on too: the relay and older pages still call it.
workers_dev = true

[observability]
enabled = true

# Configure D1 binding for this Worker.
[[d1_databases]]
binding = "DB"
database_name = "protectedshare"
database_id = "36a87f23-cbee-4380-858b-bd713d5c82f5"

# Purge expired notes, secrets, drops, requests, receipts, and idle chat rows.
[triggers]
crons = ["*/30 * * * *"]

# File-drop chunk bytes live in R2; D1 keeps each chunk's size and the upload budget. Create the
# bucket before deploying, or the deploy fails:
#   npx wrangler r2 bucket create protectedshare-drops
# Optional backstop for anything a delete missed (the cron also sweeps orphans every 30 minutes):
#   npx wrangler r2 bucket lifecycle add protectedshare-drops expire-old-drops drops/ --expire-days 31
# Self-hosting without R2? Delete this block: the API detects that and keeps chunks in D1.
[[r2_buckets]]
binding = "DROPS_BUCKET"
bucket_name = "protectedshare-drops"

# Spending guard (src/lib/drop-budget.ts). Cloudflare can't cap spending, and R2 bills anything
# past its monthly free allowance (10 GB-month stored, 1 million Class A writes, 10 million
# Class B reads; egress is free), rounded up to a whole unit. So the API caps file drops itself:
# at a cap it refuses new uploads or downloads (503 { code: "DROP_CAPACITY" }) instead of billing.
# These values stay inside the free allowance: 9 GB stored, and 30,000 writes and 300,000 reads
# per UTC day (930,000 and 9.3 million over a 31-day month). The allowance covers the whole
# Cloudflare account, so lower them if other projects there use R2. Raising them can cost money:
# each GB stored past 10 is $0.015 a month (a 1,000 GB cap, if filled, is about $15 a month).
# Without these lines the same defaults apply.
[vars]
DROP_STORAGE_LIMIT_GB = 9
R2_CLASS_A_DAILY_LIMIT = 30000
R2_CLASS_B_DAILY_LIMIT = 300000

# Rate limits (Workers Rate Limiting binding). Counted per Cloudflare location and eventually
# consistent. Each namespace_id must be unique within the Cloudflare account. Every limiter is
# optional: delete a block and that check is skipped. Over a limit the API answers 429
# { code: "RATE_LIMITED" } with Retry-After.

# Wrong keys or passwords per share, chat room or notepad. Past the limit, password-protected
# targets are locked for 10 minutes (auth_lockouts in D1); key-only links just get 429s.
[[ratelimits]]
name = "RL_AUTH"
namespace_id = "71001"
simple = { limit = 10, period = 60 }

# Claims per chat room (every join claims the room).
[[ratelimits]]
name = "RL_CLAIM"
namespace_id = "71002"
simple = { limit = 30, period = 60 }

# Answers sent to one secret request (only the first is accepted).
[[ratelimits]]
name = "RL_RESPOND"
namespace_id = "71003"
simple = { limit = 10, period = 60 }

# Messages posted per chat room.
[[ratelimits]]
name = "RL_CHAT_POST"
namespace_id = "71004"
simple = { limit = 120, period = 60 }

# Abuse reports per reported share (also caps report emails to the admin).
[[ratelimits]]
name = "RL_REPORT"
namespace_id = "71005"
simple = { limit = 5, period = 60 }

# Creates per client IP, IPv6 grouped by /64 (notes, secrets, drops, requests, reports, inquiries,
# notepads). It only stops floods. The hosted site's browsers call this Worker directly
# (api.protectedshare.me), so CF-Connecting-IP is the visitor's own address. Requests relayed through
# a web host (its /api proxy or rewrite, or pages built before the switch) arrive from that host's
# shared IPs instead, which is why the limit stays high: one client reaching it there holds up
# creates for everyone else on that IP until the minute is up.
# Self-hosting the web app with its built-in /api proxy? Every request then arrives from your
# server's IP, so this becomes a site-wide cap: raise it or delete this block.
[[ratelimits]]
name = "RL_CREATE"
namespace_id = "71006"
simple = { limit = 600, period = 60 }
